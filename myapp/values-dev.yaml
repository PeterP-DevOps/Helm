frontend:
  replicaCount: 1

  image:
    repository: nginx
    tag: "1.28"
    pullPolicy: IfNotPresent

backend:
  replicaCount: 1

  image:
    repository: wbitt/network-multitool
    tag: "latest"
    pullPolicy: Always

ingress:
  enabled: true
  className: public

middleware:
  enabled: true
  name: backend-strip-api
  stripPrefix: /api